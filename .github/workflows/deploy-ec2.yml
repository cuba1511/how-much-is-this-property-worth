# Deploy to EC2: SSH → git pull → docker compose with env from GitHub Environment.
# No .env file on the server — secrets/vars are injected by Actions into the remote shell.

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_caddy_state:
        description: "Wipe Caddy certificates and accounts (forces fresh Let's Encrypt issuance)"
        type: boolean
        default: false

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      SITE_ADDRESS: ${{ vars.SITE_ADDRESS || secrets.SITE_ADDRESS }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL || secrets.ACME_EMAIL }}
      BRIGHT_DATA_CDP: ${{ secrets.BRIGHT_DATA_CDP }}
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || secrets.RESEND_FROM_EMAIL }}
      HV_API_KEY: ${{ secrets.HV_API_KEY }}
      EC2_REPO_URL: ${{ vars.EC2_REPO_URL || secrets.EC2_REPO_URL }}
      RESET_CADDY_STATE: ${{ inputs.reset_caddy_state == true && 'true' || 'false' }}

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: SITE_ADDRESS,ACME_EMAIL,BRIGHT_DATA_CDP,BRIGHT_DATA_API_KEY,RESEND_API_KEY,RESEND_FROM_EMAIL,HV_API_KEY,EC2_REPO_URL,RESET_CADDY_STATE
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            : "${APP_DIR:?EC2_APP_DIR is not set}"

            if [[ ! -d "$APP_DIR/.git" ]]; then
              : "${EC2_REPO_URL:?EC2_REPO_URL is not set}"
              echo "Repository not found at $APP_DIR; cloning"
              mkdir -p "$(dirname "$APP_DIR")"
              git clone "$EC2_REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin main
            git reset --hard origin/main

            if [[ "${RESET_CADDY_STATE:-false}" == "true" ]]; then
              echo "→ Resetting Caddy state (certs + ACME accounts)"
              docker compose stop caddy || true
              docker compose rm -f caddy || true
              docker volume rm -f "$(basename "$APP_DIR" | tr '[:upper:]' '[:lower:]')_caddy_data" 2>/dev/null || true
              docker volume rm -f "$(basename "$APP_DIR" | tr '[:upper:]' '[:lower:]')_caddy_config" 2>/dev/null || true
            fi

            chmod +x scripts/vps-deploy.sh
            ./scripts/vps-deploy.sh

            docker image prune -f
            sleep 5
            curl -fsS http://127.0.0.1/health

      - name: Health check (public)
        id: public_health
        continue-on-error: true
        env:
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS || secrets.SITE_ADDRESS }}
        run: |
          SITE_ADDRESS="${SITE_ADDRESS#"${SITE_ADDRESS%%[![:space:]]*}"}"
          SITE_ADDRESS="${SITE_ADDRESS%"${SITE_ADDRESS##*[![:space:]]}"}"

          if [[ "$SITE_ADDRESS" == ":80" || -z "$SITE_ADDRESS" ]]; then
            echo "Skipping public HTTPS check"
            exit 0
          fi

          if [[ "$SITE_ADDRESS" == http://* || "$SITE_ADDRESS" == https://* ]]; then
            HEALTH_URL="${SITE_ADDRESS%/}/health"
          else
            HEALTH_URL="https://${SITE_ADDRESS%/}/health"
          fi

          echo "Checking public health endpoint..."
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 20 \
            "$HEALTH_URL"

      - name: Caddy diagnostics
        if: always()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail

            echo "Docker containers:"
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            CADDY_CONTAINER="$(docker ps --filter 'label=com.docker.compose.service=caddy' --format '{{.Names}}' | sed -n '1p')"
            if [[ -z "$CADDY_CONTAINER" ]]; then
              echo "Caddy container not found"
              exit 0
            fi

            echo ""
            echo "Caddy logs (last 200 lines):"
            docker logs --tail=200 "$CADDY_CONTAINER" 2>&1 | tail -200

            echo ""
            echo "ACME issuer used (looking for 'staging' would indicate test certs):"
            docker logs "$CADDY_CONTAINER" 2>&1 | grep -E 'acme-(staging-)?v02|certificate obtained|issuer' | tail -20 || echo "(no ACME entries)"
